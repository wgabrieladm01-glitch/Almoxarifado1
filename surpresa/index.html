<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0f5"><title>Uma surpresa pra você 🎀</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 15% 12%,#fff 0,transparent 38%),linear-gradient(150deg,#ffe4ef,#ffd1e2 50%,#f9d6ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#7d2452;display:grid;place-items:center;padding:24px;overflow-x:hidden}.card{width:min(100%,480px);background:#ffffffdf;backdrop-filter:blur(12px);border:1px solid #fff;border-radius:30px;padding:30px 20px;box-shadow:0 18px 55px #ad477033;text-align:center;position:relative;z-index:1}h1{font-size:clamp(26px,7vw,35px);margin:4px 0 10px}p{line-height:1.55}.intro{margin:0 auto 24px;max-width:310px}.gifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.gift{background:linear-gradient(150deg,#fff5fa,#ffd5e7);border:2px solid #ffc0d8;border-radius:20px;padding:18px 4px;min-height:145px;cursor:pointer;color:#8b2a59;box-shadow:0 7px 15px #e987a32b;transition:transform .2s,box-shadow .2s}.gift:active{transform:scale(.95)}.gift:focus-visible,.again:focus-visible{outline:3px solid #a62a65;outline-offset:3px}.gift span{display:block;font-size:clamp(44px,12vw,66px);animation:bob 2.5s ease-in-out infinite}.gift:nth-child(2) span{animation-delay:.3s}.gift:nth-child(3) span{animation-delay:.6s}.gift strong{font-size:13px;display:block;margin-top:6px}.gift:disabled{opacity:.55;cursor:default}.gift.selected{opacity:1;border-color:#e13e7d;box-shadow:0 0 0 3px #ffc1d9}.result{margin-top:22px;padding:20px 14px;background:#fff2f8;border-radius:20px;animation:appear .5s both}.result .emoji{font-size:55px;display:block}.result h2{font-size:23px;margin:8px 0}.again{background:#d93877;color:white;border:0;border-radius:999px;padding:13px 23px;font-weight:700;font-size:15px;margin-top:16px;cursor:pointer}.foot{font-size:12px;opacity:.7;margin:22px 0 0}.heart{position:fixed;pointer-events:none;z-index:0;animation:float 3s ease-out forwards;font-size:24px}@keyframes float{from{opacity:1;transform:translateY(0) rotate(0)}to{opacity:0;transform:translateY(-65vh) rotate(30deg)}}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style>
</head><body><main class="card"><div aria-hidden="true" style="font-size:42px">💝</div><h1>Uma surpresa pra você!</h1><p class="intro">Preparei três caixinhas especiais... 🎀<br>Escolha uma e descubra o que te espera!</p><div class="gifts" id="gifts"><button class="gift" data-id="0" aria-label="Abrir caixa 1"><span>🎁</span><strong>Caixa 1</strong></button><button class="gift" data-id="1" aria-label="Abrir caixa 2"><span>🎁</span><strong>Caixa 2</strong></button><button class="gift" data-id="2" aria-label="Abrir caixa 3"><span>🎁</span><strong>Caixa 3</strong></button></div><section id="result" class="result" role="status" aria-live="polite" hidden><span id="emoji" class="emoji"></span><h2 id="title"></h2><p id="description"></p><button id="again" class="again">Escolher outra caixa 💕</button></section><p class="foot">Feito com carinho, especialmente pra você ❤️</p></main>
<script>
const surprises=[{emoji:"😘",title:"Vale um beijo!",description:"Você ganhou um beijo meu! Pode resgatar quando a gente se encontrar. 💋"},{emoji:"🌹",title:"Um encontro especial!",description:"Você ganhou um encontro comigo. Eu cuido dos detalhes, você só traz esse sorriso lindo! 💖"},{emoji:"🤗",title:"Abraço sem prazo!",description:"Você ganhou um abraço bem apertado, daqueles que fazem a gente esquecer do mundo. 💞"}];
const buttons=[...document.querySelectorAll(".gift")],result=document.getElementById("result");
function hearts(){for(let i=0;i<22;i++){const h=document.createElement("span");h.className="heart";h.textContent=["💗","💕","❤️","✨"][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+"vw";h.style.bottom="-30px";h.style.animationDelay=Math.random()*.7+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),3900)}}
buttons.forEach(b=>b.addEventListener("click",()=>{const s=surprises[Number(b.dataset.id)];buttons.forEach(x=>{x.disabled=true;x.classList.toggle("selected",x===b)});document.getElementById("emoji").textContent=s.emoji;document.getElementById("title").textContent=s.title;document.getElementById("description").textContent=s.description;result.hidden=false;hearts()}));
document.getElementById("again").addEventListener("click",()=>{buttons.forEach(b=>{b.disabled=false;b.classList.remove("selected")});result.hidden=true;buttons[0].focus()});
</script></body></html>
